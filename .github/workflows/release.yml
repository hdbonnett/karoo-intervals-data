name: Release

# Push a tag such as v0.1.5 to build the APK and publish it as a GitHub Release.
# The release asset link can be shared to the Hammerhead Companion app to install on the Karoo.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: read # karoo-ext comes from GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Test and build
        env:
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="karoo-intervals-data-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes
